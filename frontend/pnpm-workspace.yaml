packages:
  - '.'
# linux 항목은 배포(도커) 빌드용이다.
# current 를 함께 두어야 macOS·Windows 개발자도 네이티브 바이너리를 받는다.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc

# pnpm 10+ 는 의존성의 빌드 스크립트를 기본 차단한다.
# 두 패키지는 네이티브 바이너리를 빌드해야 하므로 명시적으로 허용한다.
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
