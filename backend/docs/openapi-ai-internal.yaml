openapi: 3.1.0
info:
  title: 관계온도 백엔드-AI 내부 API
  version: 1.0.0
  summary: 정규화 대화 기반 동기 PRQC 분석 계약
  description: |
    Backend Worker가 AI 서버에 정규화된 1:1 대화를 전달하고 PRQC 6개 구성요소와
    구조화 근거를 한 번에 받는 내부 API다. 프론트엔드는 호출하지 않는다.

    AI 서버는 공개 AnalysisJob, 단계별 진행률, 웹훅, 체크인 활용, canonical
    overall.score 계산을 담당하지 않는다. Backend Worker가 AI 결과에 버전된
    관계 유형별 가중치를 적용해 최종 종합점수를 계산한다.
servers:
  - url: /internal/v1
    description: Private network internal API
tags:
  - name: PRQC Analyses
security:
  - serviceBearer: []
paths:
  /prqc-analyses:
    post:
      tags: [PRQC Analyses]
      operationId: analyzePrqc
      summary: 정규화 대화를 동기 분석
      description: |
        권장 입력은 짧은 만료시간의 다운로드 전용 Presigned URL이다. Object Storage가
        없는 환경에서는 multipart로 gzip CSV을 전송할 수 있다. AI 서버는 단계별
        진행률이나 콜백 없이 최종 결과를 동기 반환한다. 권장 호출 타임아웃은
        60~120초이며 예상 처리 시간은 20~30초다.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectReferenceAnalysisRequest"
            examples:
              objectReference:
                value:
                  analysisId: 0198c8a7-3000-7000-8000-000000000001
                  relationshipType: FRIEND
                  conversation:
                    url: https://storage.example.com/private/conversation?signature=redacted
                    format: NORMALIZED_CSV_GZIP
                    formatVersion: conversation-csv-1.0.0
                    contentEncoding: gzip
                    sizeBytes: 4821941
                    sha256: a878d8f81f41f32c7d1a4748f35e92318f367689632be2f3c9d662e705c4ec9d
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MultipartAnalysisRequest"
            encoding:
              file:
                contentType: application/gzip
      responses:
        "200":
          description: PRQC 분석 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrqcAnalysisResponse"
              examples:
                success:
                  value:
                    analysisId: 0198c8a7-3000-7000-8000-000000000001
                    modelVersion: prqc-2026-08-19.1
                    promptVersion: relationship-evidence-1.0.0
                    processedMessageCount: 8421
                    components:
                      satisfaction: 55
                      commitment: 45
                      intimacy: 68
                      trust: 72
                      passion: 40
                      love: 58
                    evidences:
                      - component: passion
                        score: 40
                        summary: 최근 한 달간 대화 빈도가 감소한 것이 관찰됐어요.
                        metric:
                          name: weeklyConversationCount
                          currentValue: 1.1
                          previousValue: 3.2
                          unit: 회/주
                          period: 최근 4주와 이전 4주 비교
                    warnings: []
                    completedAt: "2026-08-19T06:22:24Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ConversationNotAccessible"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: service-token
      description: 백엔드 Worker 전용 서비스 자격증명

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      description: 백엔드 공개 요청부터 이어지는 분산 추적 ID
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 요청 본문의 analysisId와 같은 UUID
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: 필수 필드, 형식값 또는 해시 오류. 재시도하지 않는다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorEnvelope"
    Unauthorized:
      description: 서비스 토큰이 없거나 유효하지 않음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorEnvelope"
    Forbidden:
      description: 서비스 토큰에 분석 호출 권한이 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorEnvelope"
    ConversationNotAccessible:
      description: Presigned URL의 대화 파일을 조회할 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorEnvelope"
    Conflict:
      description: 같은 멱등성 키에 다른 요청 본문이 사용됨
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorEnvelope"
    UnprocessableEntity:
      description: 메시지 부족 또는 정규화 대화 데이터 분석 불가
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorEnvelope"
    TooManyRequests:
      description: AI 호출량 제한. 백엔드가 Retry-After 이후 재시도할 수 있음.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorEnvelope"
    InternalError:
      description: 예상하지 못한 AI 내부 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorEnvelope"
    ServiceUnavailable:
      description: 모델 또는 외부 AI 공급자 일시 장애. 재시도 가능.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorEnvelope"
    GatewayTimeout:
      description: AI 분석 시간 초과. 재시도 가능.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorEnvelope"

  schemas:
    RelationshipType:
      type: string
      enum: [ROMANTIC_PARTNER, FRIEND, FAMILY, COWORKER, OTHER]
    Score:
      type: integer
      minimum: 0
      maximum: 100
    Sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
      description: 소문자 16진수 SHA-256
    ConversationFormat:
      type: string
      const: NORMALIZED_CSV_GZIP
    FormatVersion:
      type: string
      pattern: ^conversation-csv-[0-9]+\.[0-9]+\.[0-9]+$
      example: conversation-csv-1.0.0
    ObjectConversationReference:
      type: object
      additionalProperties: false
      required:
        - url
        - format
        - formatVersion
        - contentEncoding
        - sizeBytes
        - sha256
      properties:
        url:
          type: string
          format: uri
          pattern: ^https://
          description: 다운로드 전용 5~15분 만료 Presigned URL
        format:
          $ref: "#/components/schemas/ConversationFormat"
        formatVersion:
          $ref: "#/components/schemas/FormatVersion"
        contentEncoding:
          type: string
          const: gzip
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 104857600
          description: 정규화 gzip 결과 크기. MVP 내부 상한 100MB.
        sha256:
          $ref: "#/components/schemas/Sha256"
    ObjectReferenceAnalysisRequest:
      type: object
      additionalProperties: false
      required: [analysisId, relationshipType, conversation]
      properties:
        analysisId:
          type: string
          format: uuid
          description: Idempotency-Key와 동일해야 함
        relationshipType:
          $ref: "#/components/schemas/RelationshipType"
        conversation:
          $ref: "#/components/schemas/ObjectConversationReference"
    MultipartAnalysisRequest:
      type: object
      additionalProperties: false
      required:
        - analysisId
        - relationshipType
        - format
        - formatVersion
        - sha256
        - file
      properties:
        analysisId:
          type: string
          format: uuid
          description: Idempotency-Key와 동일해야 함
        relationshipType:
          $ref: "#/components/schemas/RelationshipType"
        format:
          $ref: "#/components/schemas/ConversationFormat"
        formatVersion:
          $ref: "#/components/schemas/FormatVersion"
        sha256:
          $ref: "#/components/schemas/Sha256"
        file:
          type: string
          format: binary
          description: gzip으로 압축한 정규화 CSV
    PrqcComponents:
      type: object
      additionalProperties: false
      required: [satisfaction, commitment, intimacy, trust, passion, love]
      properties:
        satisfaction:
          $ref: "#/components/schemas/Score"
        commitment:
          $ref: "#/components/schemas/Score"
        intimacy:
          $ref: "#/components/schemas/Score"
        trust:
          $ref: "#/components/schemas/Score"
        passion:
          $ref: "#/components/schemas/Score"
        love:
          $ref: "#/components/schemas/Score"
    EvidenceMetric:
      type: object
      additionalProperties: false
      required: [name, currentValue, previousValue, unit, period]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        currentValue:
          type: number
        previousValue:
          type: [number, "null"]
        unit:
          type: string
          minLength: 1
          maxLength: 30
        period:
          type: string
          minLength: 1
          maxLength: 100
    Evidence:
      type: object
      additionalProperties: false
      required: [component, score, summary, metric]
      properties:
        component:
          type: string
          enum: [satisfaction, commitment, intimacy, trust, passion, love]
        score:
          $ref: "#/components/schemas/Score"
        summary:
          type: string
          minLength: 1
          maxLength: 1000
        metric:
          oneOf:
            - $ref: "#/components/schemas/EvidenceMetric"
            - type: "null"
    AnalysisWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - LIMITED_DATE_RANGE
            - LOW_MESSAGE_COUNT
            - NO_STRUCTURED_EVIDENCE
            - PARTIAL_ANALYSIS
        message:
          type: string
          maxLength: 500
    PrqcAnalysisResponse:
      type: object
      additionalProperties: false
      required:
        - analysisId
        - modelVersion
        - processedMessageCount
        - components
        - evidences
        - warnings
        - completedAt
      properties:
        analysisId:
          type: string
          format: uuid
        modelVersion:
          type: string
          pattern: ^prqc-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$
          example: prqc-2026-08-19.1
        promptVersion:
          type: [string, "null"]
          pattern: ^relationship-evidence-[0-9]+\.[0-9]+\.[0-9]+$
          example: relationship-evidence-1.0.0
        processedMessageCount:
          type: integer
          minimum: 0
        components:
          $ref: "#/components/schemas/PrqcComponents"
        evidences:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/Evidence"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisWarning"
        completedAt:
          type: string
          format: date-time
    InternalErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, retryable, requestId, details]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - AUTH_REQUIRED
            - FORBIDDEN
            - CONVERSATION_NOT_ACCESSIBLE
            - IDEMPOTENCY_KEY_REUSED
            - INSUFFICIENT_MESSAGES
            - INVALID_CONVERSATION_DATA
            - AI_RATE_LIMITED
            - AI_INTERNAL_ERROR
            - AI_PROVIDER_UNAVAILABLE
            - AI_TIMEOUT
        message:
          type: string
          maxLength: 500
        retryable:
          type: boolean
        requestId:
          type: string
        details:
          type: [object, "null"]
          additionalProperties: true
          description: 원문, URL, 토큰, 프롬프트, 공급자 응답은 포함하지 않음
    InternalErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/InternalErrorDetail"
